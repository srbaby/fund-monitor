name: Market API smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Custom API URL; pages.dev requires the diagnostic token"
        required: true
        default: "https://fund-api.bailuzun.com"
      market_session:
        description: "Set to open to compare HS300 primary and backup points during mainland trading"
        required: false
        type: choice
        options:
          - closed
          - open
        default: closed

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ inputs.base_url }}
      DIAGNOSTIC_TOKEN: ${{ secrets.MARKET_API_DIAGNOSTIC_TOKEN }}
      FUND_CODES: "003949,160622,110027,011554,022435,007045,007413"
    steps:
      - name: Check diagnostic secret
        run: test -n "$DIAGNOSTIC_TOKEN"

      - name: Verify current API contracts
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          request() {
            curl --fail --silent --show-error --retry 2 \
              -H "X-Diagnostic-Token: $DIAGNOSTIC_TOKEN" \
              "$1"
          }
          verify_codes() {
            local endpoint="$1"
            local expected="$2"
            local required_csv="$3"
            local output
            echo "Checking $endpoint"
            if ! output="$(request "$BASE_URL$endpoint")"; then
              failures=1
              return
            fi
            echo "$output" | jq -c '{ok, status, source, count: (.data | length), diagnostic}'
            if ! echo "$output" | jq -e \
              --arg expected "$expected" \
              --arg required "$required_csv" '
                (.ok == true and .status == $expected) and
                (($required | split(",")) - ([.data[].code] | unique) | length == 0)
              ' >/dev/null; then
              failures=1
            fi
          }
          verify_count() {
            local endpoint="$1"
            local expected="$2"
            local expected_count="$3"
            local output
            echo "Checking $endpoint"
            if ! output="$(request "$BASE_URL$endpoint")"; then
              failures=1
              return
            fi
            echo "$output" | jq -c '{ok, status, source, count: (.data | length), diagnostic}'
            if ! echo "$output" | jq -e \
              --arg expected "$expected" \
              --argjson count "$expected_count" '
                .ok == true and .status == $expected and
                (.data | length == $count) and
                ([.data[].code] | unique | length == $count)
              ' >/dev/null; then
              failures=1
            fi
          }

          core="000300,000510,000905,000832,000012,HSI"
          all_factors="$core,159352,000013,000688,399006"
          verify_codes "/v1/indices?force=primary" primary "$all_factors"
          verify_codes "/v1/indices?force=backup" backup "$core"
          verify_count "/v1/funds/official?codes=$FUND_CODES&force=primary" primary 7
          verify_count "/v1/funds/official?codes=$FUND_CODES&force=backup" backup 7

          nav="$(request "$BASE_URL/v1/nav/today")"
          echo "$nav" | jq -c '{ok, date, previousDate, count, updatedAt}'
          echo "$nav" | jq -e '
            .ok == true and
            (.date | type == "string") and
            (.funds | type == "object")
          ' >/dev/null || failures=1

          removed_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "X-Diagnostic-Token: $DIAGNOSTIC_TOKEN" \
            "$BASE_URL/v1/funds/estimate?codes=$FUND_CODES")"
          test "$removed_status" = "404" || failures=1

          anchor="$(request "$BASE_URL/v1/indices?force=primary")"
          echo "$anchor" | jq -e '
            .data[] | select(.code == "000300") |
            (.pe > 0 and .marketCap > 0)
          ' >/dev/null || failures=1

          test "$failures" = 0

      - name: Compare HS300 primary and backup points during trading
        if: ${{ inputs.market_session == 'open' }}
        shell: bash
        run: |
          set -euo pipefail
          request() {
            curl --fail --silent --show-error --retry 2 \
              -H "X-Diagnostic-Token: $DIAGNOSTIC_TOKEN" \
              "$1"
          }
          primary="$(request "$BASE_URL/v1/indices?force=primary")"
          backup="$(request "$BASE_URL/v1/indices?force=backup")"
          primary_price="$(echo "$primary" | jq -er '.data[] | select(.code == "000300") | .price')"
          backup_price="$(echo "$backup" | jq -er '.data[] | select(.code == "000300") | .price')"
          primary_time="$(echo "$primary" | jq -er '.data[] | select(.code == "000300") | .quoteAt')"
          backup_time="$(echo "$backup" | jq -er '.data[] | select(.code == "000300") | .quoteAt')"
          relative_delta="$(awk -v primary="$primary_price" -v backup="$backup_price" \
            'BEGIN { printf "%.6f", (primary - backup < 0 ? backup - primary : primary - backup) / backup }')"
          echo "HS300 primary=$primary_price at $primary_time; backup=$backup_price at $backup_time; delta=$relative_delta"
          awk -v delta="$relative_delta" 'BEGIN { exit !(delta <= 0.0005) }'

      - name: Verify force is denied without diagnostic token
        shell: bash
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "$BASE_URL/v1/indices?force=primary")"
          test "$status" = "403"
